name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
        type: string
      stage_name:
        description: API Gateway stage
        required: true
        default: prod
        type: string
      cors_allowed_origin:
        description: Browser origin allowed by CORS (* or https://your-app.example)
        required: true
        default: '*'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Terraform apply and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test Lambda
        run: npm test

      - name: Configure AWS credentials with OIDC
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region }}

      - name: Configure AWS credentials with access keys
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Warn when using long-lived AWS credentials
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
        run: echo '::warning::AWS_ROLE_TO_ASSUME is not configured; deployment is using long-lived repository secrets. Prefer GitHub OIDC for production deployments.'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.3'
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform apply
        run: >-
          terraform -chdir=terraform apply -auto-approve
          -var="aws_region=${{ inputs.aws_region }}"
          -var="stage_name=${{ inputs.stage_name }}"
          -var="cors_allowed_origin=${{ inputs.cors_allowed_origin }}"

      - name: Capture deployed endpoint
        id: endpoint
        run: echo "url=$(terraform -chdir=terraform output -raw api_endpoint_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed API
        env:
          API_ENDPOINT: ${{ steps.endpoint.outputs.url }}
        run: npm run smoke

      - name: Deployment summary
        env:
          API_ENDPOINT: ${{ steps.endpoint.outputs.url }}
        run: |
          echo "## Sentiment API deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Endpoint: \`$API_ENDPOINT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment and live Comprehend smoke test passed." >> "$GITHUB_STEP_SUMMARY"
